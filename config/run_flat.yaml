protocol: flat
universe: [AAPL, TSLA, NVDA, PG, JPM, SPY, EURUSD=X, USDJPY=X, ^XAU, CL=F, ZN=F]
start: "2020-01-01"
end: "2024-12-31"
market_api:
  provider: "alphavantage"
  key_env: "ALPHAVANTAGE_API_KEY"
  throttle_per_sec: 4.0
costs:
  tc_bps: 5
  slippage_bps: 2
  borrow_bps_annual: 30
stress_scenarios:
  market_down_5: -0.05
outdir: "runs/flat_2020_2024"
llm_model: "gemini-2.5-flash-lite"
optimize_cash: true
llm_temperature: 0.5
llm_max_retries: 0
llm_toplevel_max_retries: 1
llm_toplevel_backoff_seconds: 1.0
enable_tools: true
seeds:
  global: 7
  chair_temp: 0.2
  analyst_temp: 0.4
toggles:
  structured_mode: "strict"
memory:
  episodic: false
  k: 5
  alpha_return: 1.0
  alpha_risk: 1.0
  alpha_tc: 1.0
